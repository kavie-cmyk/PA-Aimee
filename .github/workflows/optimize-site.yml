name: Optimize PA-Aimee site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-site.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove section 7 and optimize UI
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          section7 = '''<h2 class="h2" style="font-size:34px;margin-top:28px"><span class="sec">7</span>Phân công và bước triển khai tiếp theo</h2><div class="roles"><div class="role"><b>BD SAVA</b><p>Điều phối phương án kinh doanh, theo dõi phần chia doanh thu, tổng hợp hiệu quả và kế hoạch bán tiếp.</p></div><div class="role"><b>Savrse / Product / Tech</b><p>Khảo sát, xây dựng Phase 1, kiểm thử, thiết lập tracking và vận hành kỹ thuật theo phạm vi đã chốt.</p></div><div class="role"><b>Aime’e Business / Sales / Marketing</b><p>Cung cấp quyền tiếp cận, tài liệu/asset; góp ý nội dung; đưa trải nghiệm vào kênh bán, sử dụng trong Sales và phối hợp truyền thông.</p></div><div class="role"><b>Finance hai bên</b><p>Đối soát booking, doanh thu thực thu và phần chia cho SAVA.</p></div></div><div class="final">BD SAVA phối hợp Savrse và đầu mối Aime’e chốt danh sách asset, bộ tính năng, dữ liệu cần theo dõi và lịch triển khai cho Welcome/Reception và Eden Balcony Suite. Finance/Legal hai công ty hoàn thiện thỏa thuận hợp tác trong thời gian chuẩn bị sản xuất và trước khi Phase 1 được đưa vào vận hành thực tế.</div>'''

          if section7 in s:
              s = s.replace(section7, '')

          css = '''
/* site-opt-v2 */
.dots a.active{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.18);transform:scale(1.12)}
#p6 .measure{grid-template-columns:1.12fr .88fr;gap:22px;align-items:stretch}
#p6 .funnel{padding:24px;min-height:340px;display:flex;flex-direction:column;justify-content:center}
#p6 .mcard{align-content:stretch}
#p6 .m{min-height:132px;display:flex;flex-direction:column;justify-content:center}
#p6 .next{margin-top:20px}
@media(max-width:560px){.toolbar{max-width:calc(100vw - 16px);overflow:auto;white-space:nowrap}.toolbar button{padding:8px 9px;font-size:11px}#p6 .measure{grid-template-columns:1fr}#p6 .funnel{min-height:0}}
'''
          if '/* site-opt-v2 */' not in s:
              s = s.replace('</style>', css + '</style>')

          nav_js = '''
/* nav-opt-v2 */
const navDots=[...document.querySelectorAll('.dots a')];
const pageObserver=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){const i=pages.indexOf(entry.target);navDots.forEach((d,j)=>d.classList.toggle('active',i===j));}})},{threshold:.55});
pages.forEach(p=>pageObserver.observe(p));
'''
          if '/* nav-opt-v2 */' not in s:
              s = s.replace('</script>', nav_js + '</script>')

          # Lazy-load non-hero phase-1 imagery for a lighter first paint.
          s = s.replace('<div class="photo"><img src=', '<div class="photo"><img loading="lazy" decoding="async" src=')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit optimized site
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove section 7 and optimize site UI"
          git push
