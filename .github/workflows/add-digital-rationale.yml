name: Add Digital Experience rationale

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-digital-rationale.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update website
        run: python scripts/add_digital_rationale.py
      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Digital Experience rationale section'
          git push
